server {
    listen 80;
    server_name localhost; # Puedes cambiar esto si usas un dominio

    # Servir los archivos estáticos de la aplicación React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Para el enrutamiento del lado del cliente (React Router)
    }

    # Proxy para las peticiones a la API de Django
    location /api/ {
        # Elimina el prefijo /api/ antes de reenviar al backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000; # 'backend' es el nombre del servicio en docker-compose.yml
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Opcional: Servir archivos estáticos y media de Django directamente si es necesario
    # (Generalmente Nginx se encarga de esto en producción, pero para desarrollo
    # se puede configurar para que el backend sirva los estáticos a través de Nginx)
    # location /static/ {
    #     alias /app/staticfiles/; # Asegúrate de que esta ruta coincida con donde Django guarda los estáticos
    # }
    # location /media/ {
    #     alias /app/media/; # Asegúrate de que esta ruta coincida con donde Django guarda los media
    # }

    # Manejo de errores (opcional)
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /usr/share/nginx/html;
    }
}
